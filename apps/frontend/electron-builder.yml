appId: com.caravan.app
productName: Caravan
executableName: caravan
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
files:
  - out/**/*
extraResources:
  - from: ../backend/dist
    to: backend
linux:
  syncDesktopName: true
  target: AppImage
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target: nsis
